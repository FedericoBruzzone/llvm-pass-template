name: Ubuntu x86

on:
  push:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler:
          - { compiler: GNU, CC: gcc, CXX: g++ }
          - { compiler: LLVM, CC: clang, CXX: clang++ }
        type: [Debug, Release]
    steps:
      - uses: actions/checkout@v1
      - name: Install Dependencies
        env:
          CC: ${{ matrix.compiler.CC }}
          CXX: ${{ matrix.compiler.CXX }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/llvm-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list

          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            llvm-21 \
            llvm-21-dev \
            llvm-21-tools \
            clang-21 \
            python3-setuptools

          sudo pip3 install lit
      - name: Build `llvm-pass-template`
        run: |
          cd $GITHUB_WORKSPACE
          mkdir build && cd build
          cmake -DLLVM_INSTALL_DIR="/usr/lib/llvm-21/" -DCMAKE_BUILD_TYPE=${{ matrix.type }} ../
          make -j2
      - name: Run tests for `llvm-pass-template`
        run: |
          cd $GITHUB_WORKSPACE/build
          lit -va ./test/
